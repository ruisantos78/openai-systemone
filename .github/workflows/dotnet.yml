name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/OpenAI.SystemOne/OpenAI.SystemOne.csproj

    - name: Build
      run: dotnet build src/OpenAI.SystemOne/OpenAI.SystemOne.csproj --no-restore

    - name: Test
      if: hashFiles('test/**/*.csproj') != ''
      run: dotnet test --no-build --verbosity normal
