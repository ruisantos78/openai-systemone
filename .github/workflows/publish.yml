name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Add GitHub Packages source
      run: |
        dotnet nuget add source \
          --username ruisantos78 \
          --password "${{ secrets.GITHUB_TOKEN }}" \
          --store-password-in-clear-text \
          --name github \
          "https://nuget.pkg.github.com/ruisantos78/index.json"

    - name: Restore dependencies
      run: dotnet restore src/OpenAI.SystemOne/OpenAI.SystemOne.csproj

    - name: Build
      run: dotnet build src/OpenAI.SystemOne/OpenAI.SystemOne.csproj --no-restore -c Release

    - name: Test
      if: hashFiles('test/**/*.csproj') != ''
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Pack
      run: dotnet pack src/OpenAI.SystemOne/OpenAI.SystemOne.csproj -c Release --no-build -o out

    - name: Push to GitHub Packages
      run: dotnet nuget push out/*.nupkg --source github --skip-duplicate
